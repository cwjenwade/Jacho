  <script>
document.addEventListener("DOMContentLoaded",()=>{
'use strict';
(() => {
  const button=document.querySelector('.menu-button');
  const nav=document.querySelector('.mobile-nav');
  if(button && nav){
    function close(){nav.dataset.open='false';button.setAttribute('aria-expanded','false');}
    button.addEventListener('click',()=>{
      const open=nav.dataset.open!=='true';nav.dataset.open=String(open);button.setAttribute('aria-expanded',String(open));
    });
    nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));
    document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  }
  const tabs=document.querySelectorAll('.journal-tab');
  const search=document.querySelector('.journal-search');
  const cards=[...document.querySelectorAll('.journal-card')];
  const empty=document.querySelector('.journal-empty');
  let category='全部';
  function filter(){
    const query=(search?.value||'').trim().toLowerCase();let count=0;
    cards.forEach(card=>{const visible=(category==='全部'||card.dataset.category===category) && card.textContent.toLowerCase().includes(query);card.hidden=!visible;if(visible)count++});
    if(empty)empty.style.display=count?'none':'block';
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>{category=tab.dataset.category;tabs.forEach(t=>t.setAttribute('aria-pressed',String(t===tab)));filter()}));
  search?.addEventListener('input',filter);
  const articleHolder=document.querySelector('#dynamic-article');
  if(articleHolder){
    const data={
      'emotion-language':{title:'當情緒還沒有名字',category:'我的觀點',paragraphs:[
        '有些感受在還沒被說出來以前，已經以身體緊繃、沉默或不易解釋的不舒服被經驗到。描述情緒，是一項涉及辨識與語言組織的心理歷程。',
        '心理學研究將情緒辨識、情緒描述及情緒調節視為可以區分的構念。這些區分有助於討論人們經驗感受的差異。',
        '在諮商歷程中，談論情緒不只是為了找到一個正確的詞，也與理解感受發生的情境與人際關係有關。'
      ]},
      'relationship-patterns':{title:'為什麼我們總在關係裡重複同一段對話？',category:'關係與生活',paragraphs:[
        '在親密關係中，互動常具有循環特性。一方的回應會影響另一方接下來的反應，雙方於是共同形成熟悉的互動模式。',
        '只討論某一次爭執的內容，可能不足以理解為什麼相似的衝突不斷出現。伴侶治療常將情緒經驗與互動歷程放在一起討論。',
        '理解關係中的重複模式，涉及辨識彼此的反應、期待與需要。'
      ]},
      'alexithymia':{title:'述情障礙：感受與語言之間',category:'研究筆記',paragraphs:[
        '述情障礙（alexithymia）通常涉及辨識情緒的困難、描述感受的困難，以及偏向外在導向的思考方式。這些面向在研究中各有不同的測量方法。',
        '研究述情障礙時，需要區分構念定義、量表分數與實際臨床經驗。單一測驗分數不等於完整的個人心理評估。',
        '從心理計量到心理治療歷程，述情障礙提供一個理解情緒加工差異的研究方向。'
      ]},
      'counseling-process':{title:'心理諮商，究竟談些什麼？',category:'我的觀點',paragraphs:[
        '前來諮商的人，可能正面對具體的心理困擾，也可能希望理解自己在生活與關係中的經驗。',
        '心理諮商是一項有專業架構的工作。評估、治療關係、共同形成目標與持續討論，都可能構成諮商的一部分。',
        '不同取向對治療歷程的理解有所差異。以情緒經驗為焦點的工作，特別重視感受的辨識、表達及其人際脈絡。'
      ]}
    };
    const slug=new URLSearchParams(window.location.search).get('slug')||'emotion-language';
    const item=data[slug];
    if(item){document.title=item.title+'｜小祈叔叔的心理學研究';
      document.querySelector('[data-article-category]').textContent=item.category;
      document.querySelector('[data-article-title]').textContent=item.title;
      articleHolder.innerHTML='';
      item.paragraphs.forEach(t=>{const p=document.createElement('p');p.textContent=t;articleHolder.append(p)});
    }else{document.querySelector('[data-article-title]').textContent='找不到文章';}
  }
})();

});
